name: Renovate

on:
  schedule:
    # 毎日 UTC 22:00（JST 07:00）に実行し、renovate.json 側の schedule
    # （毎週土曜9時前）に従って実際の更新PRが作成されるかを判定させる
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Appのトークンを発行
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Self-hosted Renovateを実行
        uses: renovatebot/github-action@1a96852b0384df1837619d04c60b2d10d1f9ff08 # v46.1.21
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          NODE_OPTIONS: --max-old-space-size=4096
        with:
          configurationFile: renovate.json
          token: '${{ steps.app-token.outputs.token }}'
