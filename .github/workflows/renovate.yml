name: Renovate

on:
  schedule:
    # 毎日 UTC 22:00（JST 07:00）に実行し、renovate.json 側の schedule
    # （毎週土曜9時前）に従って実際の更新PRが作成されるかを判定させる
    - cron: '0 22 * * *'
  workflow_dispatch:
  # Dependency Dashboard IssueやRenovate作成PR内のチェックボックスがクリックされたときにも実行する
  issues:
    types: [edited]
  pull_request:
    types: [edited]
  # デフォルトブランチ上でRenovateが管理する依存関係定義ファイルが更新されたときにも実行する
  push:
    branches:
      - main
    paths:
      - package.json
      - yarn.lock
      - docker-compose.yml
      - mise.toml
      - .github/workflows/**
      - renovate.json

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    # issues/pull_requestイベントは、Renovate自身がGitHub Appトークンで
    # Issue/PR本文を更新した場合にも発火してしまう（GITHUB_TOKENと違い、
    # 再帰的なワークフロー実行を防ぐ仕組みが働かないため）。
    # 無限ループを避けるため、人間によるチェックボックス操作のときだけ実行する。
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (
        github.event_name == 'issues' &&
        github.event.issue.title == 'Dependency Dashboard' &&
        github.event.sender.type == 'User'
      ) ||
      (
        github.event_name == 'pull_request' &&
        startsWith(github.event.pull_request.head.ref, 'renovate/') &&
        github.event.sender.type == 'User'
      )
    steps:
      - name: GitHub Appのトークンを発行
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          # Renovate公式ドキュメント（https://docs.renovatebot.com/security-and-permissions/）の
          # 権限マトリクスに合わせて、発行するトークンの権限をインストール権限全体ではなく必要最小限に絞る
          permission-administration: read
          permission-vulnerability-alerts: read
          permission-metadata: read
          permission-checks: write
          permission-contents: write
          permission-statuses: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Self-hosted Renovateを実行
        uses: renovatebot/github-action@e09d604f8f803bb527bd8321ed5be06c460b8682 # v46.2.2
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          NODE_OPTIONS: --max-old-space-size=4096
        with:
          configurationFile: renovate.json
          token: '${{ steps.app-token.outputs.token }}'
